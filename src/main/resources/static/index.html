<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Directorio de Contactos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-100 min-h-screen p-6">

  <main class="max-w-4xl mx-auto bg-white rounded shadow p-6">
    <h1 class="text-2xl font-semibold text-sky-800 mb-4">Directorio de Contactos</h1>

    <button id="nuevoBtn" class="bg-emerald-600 text-white px-4 py-2 rounded hover:bg-emerald-700 mb-4">
      Nuevo Contacto
    </button>

    <table class="w-full border border-sky-300 text-left">
      <thead class="bg-sky-200 text-sky-900">
        <tr>
          <th class="p-2">ID</th>
          <th class="p-2">Nombre</th>
          <th class="p-2">Teléfono</th>
          <th class="p-2">Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaContactos" class="bg-white text-sky-800">
        <!-- Rellenado por JS -->
      </tbody>
    </table>

    <div class="mt-4 flex justify-between items-center">
      <button id="btnAnterior" class="bg-sky-400 text-white px-4 py-2 rounded hover:bg-sky-500">Anterior</button>
      <span id="infoPagina" class="text-sky-900 font-medium"></span>
      <button id="btnSiguiente" class="bg-sky-400 text-white px-4 py-2 rounded hover:bg-sky-500">Siguiente</button>
    </div>
  </main>

  <!-- Modal de formulario -->
  <div id="formModal" class="fixed inset-0 bg-black bg-opacity-40 hidden flex justify-center items-center">
    <div class="bg-sky-50 p-5 rounded-lg w-full max-w-md shadow-lg">
      <h2 class="text-lg font-bold mb-3" id="formTitulo">Nuevo Contacto</h2>
      <input type="hidden" id="contactoId">
      <input id="campoNombre" type="text" placeholder="Nombre completo" class="w-full p-2 mb-3 border rounded" />
      <input id="campoTelefono" type="text" placeholder="Número telefónico" class="w-full p-2 mb-3 border rounded" />
      <div class="flex justify-end gap-3">
        <button id="guardarBtn" class="bg-sky-600 text-white px-4 py-2 rounded hover:bg-sky-700">Guardar</button>
        <button onclick="cerrarModal()" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const API = "http://localhost:7575/personas";
    const cuerpoTabla = document.getElementById("tablaContactos");
    const modal = document.getElementById("formModal");
    const tituloModal = document.getElementById("formTitulo");
    const inputNombre = document.getElementById("campoNombre");
    const inputTelefono = document.getElementById("campoTelefono");
    const inputId = document.getElementById("contactoId");

    let listaContactos = [];
    let paginaActual = 1;
    const registrosPorPagina = 10;

    document.getElementById("nuevoBtn").addEventListener("click", () => {
      mostrarFormulario("Nuevo Contacto");
    });

    document.getElementById("guardarBtn").addEventListener("click", guardarContacto);

    function mostrarFormulario(titulo, contacto = null) {
      modal.classList.remove("hidden");
      tituloModal.textContent = titulo;
      if (contacto) {
        inputId.value = contacto.id;
        inputNombre.value = contacto.nombre;
        inputTelefono.value = contacto.telefono;
      } else {
        inputId.value = "";
        inputNombre.value = "";
        inputTelefono.value = "";
      }
    }

    function cerrarModal() {
      modal.classList.add("hidden");
    }

    async function cargarContactos() {
      const resp = await fetch(`${API}/listar`);
      listaContactos = await resp.json();
      renderizarTabla();
    }

    function renderizarTabla() {
      const inicio = (paginaActual - 1) * registrosPorPagina;
      const fin = inicio + registrosPorPagina;
      const registrosPagina = listaContactos.slice(inicio, fin);

      cuerpoTabla.innerHTML = "";
      for (const c of registrosPagina) {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td class="p-2">${c.id}</td>
          <td class="p-2">${c.nombre}</td>
          <td class="p-2">${c.telefono}</td>
          <td class="p-2 space-x-1">
            <button class="bg-yellow-400 text-white px-2 py-1 rounded hover:bg-yellow-500" onclick='editar(${JSON.stringify(c)})'>Editar</button>
            <button class="bg-red-600 text-white px-2 py-1 rounded hover:bg-red-700" onclick='eliminar(${c.id})'>Eliminar</button>
          </td>
        `;
        cuerpoTabla.appendChild(fila);
      }

      document.getElementById("infoPagina").textContent = `Página ${paginaActual} / ${Math.ceil(listaContactos.length / registrosPorPagina)}`;
      document.getElementById("btnAnterior").disabled = paginaActual === 1;
      document.getElementById("btnSiguiente").disabled = paginaActual >= Math.ceil(listaContactos.length / registrosPorPagina);
    }

    async function guardarContacto() {
      const id = inputId.value;
      const datos = {
        nombre: inputNombre.value,
        telefono: inputTelefono.value
      };
      const metodo = id ? "PUT" : "POST";
      const destino = id ? `${API}/${id}` : API;

      await fetch(destino, {
        method: metodo,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      });

      cerrarModal();
      await cargarContactos();
    }

    function editar(contacto) {
      mostrarFormulario("Editar Contacto", contacto);
    }

    async function eliminar(id) {
      if (confirm("¿Eliminar este contacto permanentemente?")) {
        await fetch(`${API}/${id}`, { method: "DELETE" });
        cargarContactos();
      }
    }

    document.getElementById("btnAnterior").addEventListener("click", () => {
      if (paginaActual > 1) {
        paginaActual--;
        renderizarTabla();
      }
    });

    document.getElementById("btnSiguiente").addEventListener("click", () => {
      if (paginaActual < Math.ceil(listaContactos.length / registrosPorPagina)) {
        paginaActual++;
        renderizarTabla();
      }
    });

    // Carga inicial
    cargarContactos();
  </script>
</body>
</html>
